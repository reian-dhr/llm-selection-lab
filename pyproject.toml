[project]
name = "model-selection-lab"
version = "0.1.0"
description = "Compare LLMs on your own task: quality, cost and speed."
readme = "README.md"
authors = [
    { name = "Reian" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "httpx2>=2.13.1",
    "mcp[cli]>=2.3.0",
    "mistralai>=3.2.0",
    "openai>=3.27.0",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "streamlit>=1.65.0",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.4",
]

[tool.uv]
# cryptography (needed by mcp) has no ready-made Intel Mac build after 48.x.
constraint-dependencies = ["cryptography<49"]

[tool.pytest.ini_options]
# The web app folder is not a package; this lets tests import its helpers (components.py).
pythonpath = ["app"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# B905 (zip strict=) is off: some zips are deliberately unequal (8 letters, fewer answers).
select = ["E", "F", "I", "B"]
ignore = ["B905"]
